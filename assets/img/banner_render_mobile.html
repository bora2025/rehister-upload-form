<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Khmer&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 800px;
            height: 1000px;
            min-width: 800px;
            min-height: 1000px;
        }
        
        #banner {
            width: 800px;
            height: 1000px;
            position: relative;
            overflow: hidden;
            background: url('phnom penh silhouette2.jpg') center bottom / cover no-repeat;
            font-family: Arial, "Khmer OS Content", "Khmer OS", "Noto Sans Khmer", sans-serif;
        }
        
        #banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(30,40,60,0.78) 0%, rgba(30,40,60,0.35) 50%, rgba(30,40,60,0.15) 100%);
            z-index: 1;
        }
        
        .title {
            position: absolute;
            top: 48px;
            left: 44px;
            right: 44px;
            text-align: center;
            font-size: clamp(32px, 4.5vw, 36px);
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.5);
            font-family: "Khmer OS Muol Light", "Noto Sans Khmer", "Khmer OS Content", "Khmer OS", sans-serif;
            line-height: 1.8;
            text-wrap: balance;
            z-index: 2;
        }

        .title span {
            display: block;
        }
        
        .khmer-text {
            position: absolute;
            top: 275px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 42px;
            color: #ffffff;
            font-family: "Khmer OS Content", "Khmer OS", "Noto Sans Khmer", sans-serif;
            line-height: 1.4;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            position: absolute;
            top: 360px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 24px;
            color: #f0f0f5;
            font-family: Arial, sans-serif;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="banner">
        <div class="title" lang="km">
            <span>ចលនាប្រឡងប្រណាំងស្នាដៃអត្ថបទ</span>
            <span>ស្រាវជ្រាវឆ្នើមក្នុងវិស័យទេសចរណ៍</span>
            <span>ប្រចាំឆ្នាំ២០២៦</span>
        </div>
        <div class="khmer-text">ទេសចរណ៍នៅកម្ពុជា</div>
        <div class="subtitle">Tourism in Cambodia</div>
    </div>
</body>
</html>
