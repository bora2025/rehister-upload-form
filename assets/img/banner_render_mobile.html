<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Khmer&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 800px;
            height: 1000px;
            min-width: 800px;
            min-height: 1000px;
        }
        
        #banner {
            width: 800px;
            height: 1000px;
            position: relative;
            overflow: hidden;
            background: url('phnom penh silhouette2.jpg') center bottom / cover no-repeat;
            font-family: Arial, "Khmer OS Content", "Khmer OS", "Noto Sans Khmer", sans-serif;
        }
        
        #banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(30,40,60,0.78) 0%, rgba(30,40,60,0.35) 50%, rgba(30,40,60,0.15) 100%);
            z-index: 1;
        }
        
        .title {
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 56px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.5);
            font-family: Arial, sans-serif;
            z-index: 2;
        }
        
        .khmer-text {
            position: absolute;
            top: 170px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 42px;
            color: #ffffff;
            font-family: "Khmer OS Content", "Khmer OS", "Noto Sans Khmer", sans-serif;
            line-height: 1.4;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            position: absolute;
            top: 245px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 24px;
            color: #f0f0f5;
            font-family: Arial, sans-serif;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="banner">
        <div class="title">Research Contest 2026</div>
        <div class="khmer-text">ទេសចរណ៍នៅកម្ពុជា</div>
        <div class="subtitle">Tourism in Cambodia</div>
    </div>
</body>
</html>
