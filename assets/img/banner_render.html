<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Khmer&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 1200px;
            height: 630px;
            min-width: 1200px;
            min-height: 630px;
        }
        
        #banner {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #fff8f0 0%, #ffe8d6 100%);
            font-family: Arial, "Khmer OS Content", "Khmer OS", "Noto Sans Khmer", sans-serif;
        }
        
        .sun-rays {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 600px;
            opacity: 0.5;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
        }
        
        .phnompenh-silhouette {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1100px;
            height: auto;
            max-height: 420px;
            object-fit: contain;
            object-position: bottom center;
        }
        
        .title {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 78px;
            font-weight: bold;
            color: #192d50;
            text-shadow: 4px 4px 0px rgba(30, 40, 60, 0.15);
            font-family: Arial, sans-serif;
        }
        
        .khmer-text {
            position: absolute;
            top: 145px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 50px;
            color: #3c3246;
            font-family: "Khmer OS Content", "Khmer OS", "Noto Sans Khmer", sans-serif;
            line-height: 1.3;
        }
        
        .subtitle {
            position: absolute;
            top: 215px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 28px;
            color: #50465a;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="banner">
        <!-- Sun rays -->
        <svg class="sun-rays" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
            <defs>
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <circle cx="500" cy="300" r="150" fill="url(#sunGrad)"/>
        </svg>
        
        <!-- Decorative circles -->
        <div class="circle" style="width:120px;height:120px;background:#ff6b6b;top:80px;left:100px;opacity:0.35;"></div>
        <div class="circle" style="width:80px;height:80px;background:#4ecdc4;top:150px;left:250px;opacity:0.4;"></div>
        <div class="circle" style="width:150px;height:150px;background:#45b7d1;top:50px;right:150px;opacity:0.3;"></div>
        <div class="circle" style="width:90px;height:90px;background:#96ceb4;top:200px;right:300px;opacity:0.4;"></div>
        <div class="circle" style="width:110px;height:110px;background:#feca57;top:100px;left:400px;opacity:0.35;"></div>
        <div class="circle" style="width:70px;height:70px;background:#ff9ff3;top:300px;left:150px;opacity:0.3;"></div>
        <div class="circle" style="width:130px;height:130px;background:#54a0ff;top:320px;right:200px;opacity:0.25;"></div>
        <div class="circle" style="width:60px;height:60px;background:#5f27cd;top:400px;left:350px;opacity:0.3;"></div>
        <div class="circle" style="width:100px;height:100px;background:#00d2d3;top:420px;right:400px;opacity:0.3;"></div>
        <div class="circle" style="width:85px;height:85px;background:#ff9f43;top:350px;left:600px;opacity:0.25;"></div>
        
        <!-- Phnom Penh skyline silhouette -->
        <img src="phnom penh silhouette.png" alt="Phnom Penh skyline" class="phnompenh-silhouette">
        
        <!-- Text -->
        <div class="title">Research Contest 2026</div>
        <div class="khmer-text">ទេសចរណ៍នៅកម្ពុជា</div>
        <div class="subtitle">Tourism in Cambodia</div>
    </div>
</body>
</html>
